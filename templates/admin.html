<!DOCTYPE html>
<html lang="en" dir="ltr" style="background:#061310">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kiwi Tap · Admin</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  body { font-family: Inter, system-ui, sans-serif; background: #061310; color: #d9ff9a; }
  .card { background: linear-gradient(160deg, rgba(255,255,255,.07), rgba(255,255,255,.02)); border: 1px solid rgba(217,255,154,.13); border-radius: 18px; padding: 14px; }
  input, select, textarea { background: #0b1b14; border: 1px solid #1d3a2b; border-radius: 10px; padding: 7px 10px; color: #e8ffb8; min-width: 0; }
  input[type=number] { width: 110px; } input[type=checkbox] { width: 20px; height: 20px; }
  .btn { background: #b6e95a; color: #061310; font-weight: 700; border-radius: 10px; padding: 7px 14px; }
  .btn.alt { background: #1d3a2b; color: #d9ff9a; } .btn.red { background: #e0584a; color: #fff; }
  .tab { padding: 8px 14px; border-radius: 12px; color: #6f8a78; font-weight: 600; white-space: nowrap; }
  .tab.on { background: rgba(182,233,90,.18); color: #e8ffb8; }
  .muted { color: #6f8a78; }
</style>
</head>
<body class="min-h-screen">
<div class="max-w-4xl mx-auto p-4">
  <h1 class="text-2xl font-extrabold mb-1">Kiwi Tap · Admin</h1>
  <p id="who" class="muted text-xs mb-3"></p>
  <nav id="nav" class="flex gap-1 overflow-x-auto pb-3"></nav>
  <div id="view" class="grid gap-3"><p class="muted">Loading…</p></div>
</div>

<script>
const tg = window.Telegram?.WebApp; tg?.ready(); tg?.expand();
const $ = s => document.querySelector(s), esc = v => String(v ?? '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
let key = localStorage.getItem('ak') || '';
const myId = tg?.initDataUnsafe?.user?.id;
$('#who').textContent = myId ? 'Your Telegram ID: ' + myId : 'Opened outside Telegram: use the admin key';
const dlg = (msg, { input = false, val = '', cancel = true } = {}) => new Promise(res => {
  const o = document.createElement('div'); o.className = 'fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70';
  o.innerHTML = `<div class="card w-full max-w-sm grid gap-3" style="background:#0b1b14"><div>${msg}</div>${input ? `<input id="dl" class="w-full" value="${esc(val)}">` : ''}
    <div class="flex gap-2 justify-end">${cancel ? '<button class="btn alt" id="dc">Cancel</button>' : ''}<button class="btn" id="dk">OK</button></div></div>`;
  document.body.append(o); const i = o.querySelector('#dl'); i?.focus();
  const done = v => { o.remove(); res(v); };
  o.querySelector('#dk').onclick = () => done(input ? i.value : true);
  o.querySelector('#dc')?.addEventListener('click', () => done(input ? null : false));
});
const alertX = m => dlg(esc(m), { cancel: false }), confirmX = m => dlg(esc(m)), promptX = m => dlg(esc(m), { input: true });
const fail = m => { $('#view').innerHTML = `<div class="card grid gap-3"><b>Could not load the panel</b><span class="muted text-sm">${esc(m)}</span>
  <div class="text-sm">Add your Telegram ID to <code>ADMIN_IDS</code> (and restart the bot), or enter the <code>ADMIN_KEY</code>.</div>
  <button class="btn" onclick="localStorage.removeItem('ak');location.reload()">Enter admin key</button></div>`; };
addEventListener('error', e => fail(e.message)); addEventListener('unhandledrejection', e => fail(e.reason?.message || 'Unauthorized or server error'));

async function api(path, method = 'GET', body) {
  const r = await fetch(path, { method, body: body ? JSON.stringify(body) : undefined,
    headers: { 'Content-Type': 'application/json', 'X-Init-Data': tg?.initData || '', 'X-Admin-Key': key } });
  if (r.status === 401) {
    key = (await promptX('Not authorised. Enter the admin key (ADMIN_KEY):')) || ''; localStorage.setItem('ak', key);
    if (!key) throw new Error('unauthorized');
    return api(path, method, body);
  }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { alertX(j.error || 'Error ' + r.status); throw new Error(j.error); }
  return j;
}

const ICONS = ['pickaxe', 'server', 'megaphone', 'landmark', 'brain', 'star', 'gem', 'flame', 'bolt', 'gift', 'trophy', 'users', 'sprout'];
const TABS = {
  dashboard, users, cards: () => crud('/api/admin/cards', [
    { k: 'id', label: 'Key (slug)' }, { k: 'name', label: 'Name' }, { k: 'icon', label: 'Icon', opts: ICONS },
    { k: 'base_cost', label: 'Base cost', type: 'number', def: 1000 }, { k: 'base_profit', label: 'Profit / hour (per level)', type: 'number', def: 100 },
    { k: 'enabled', label: 'On', type: 'bool', def: 1 }], 'id'),
  tasks: () => crud('/api/admin/tasks', [
    { k: 'id', label: 'ID', auto: true }, { k: 'title', label: 'Title' }, { k: 'kind', label: 'Type', opts: ['link', 'invite'] },
    { k: 'reward', label: 'Reward', type: 'number', def: 5000 }, { k: 'need', label: 'Friends needed (invite)', type: 'number', def: 0 },
    { k: 'url', label: 'Link (link tasks)' }, { k: 'enabled', label: 'On', type: 'bool', def: 1 }], 'id'),
  promos: () => crud('/api/admin/promos', [
    { k: 'code', label: 'Code' }, { k: 'reward', label: 'Reward', type: 'number', def: 10000 },
    { k: 'max_uses', label: 'Max uses (0 = ∞)', type: 'number', def: 0 }, { k: 'uses', label: 'Used', type: 'number', def: 0 },
    { k: 'enabled', label: 'On', type: 'bool', def: 1 }], 'code'),
  broadcast, settings,
};
const nav = $('#nav');
Object.keys(TABS).forEach(t => { const b = document.createElement('button'); b.className = 'tab'; b.textContent = t[0].toUpperCase() + t.slice(1); b.dataset.t = t; b.onclick = () => show(t); nav.append(b); });
async function show(t) {
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.t === t));
  $('#view').innerHTML = '<p class="muted">Loading…</p>'; clearInterval(show.poll); $('#view').className = 'grid gap-3';
  await TABS[t]();
}

async function dashboard() {
  const s = await api('/api/admin/stats');
  const items = [['Users', s.users], ['New (24h)', s.new_24h], ['Active (24h)', s.active_24h], ['Banned', s.banned], ['Points in circulation', s.coins],
                 ['Referrals', s.referrals], ['Card levels bought', s.cards_bought], ['Tasks completed', s.tasks_done], ['Promo redemptions', s.promo_uses]];
  $('#view').className = 'grid grid-cols-2 sm:grid-cols-3 gap-3';
  $('#view').innerHTML = items.map(([l, v]) => `<div class="card"><div class="muted text-sm">${l}</div><div class="text-3xl font-extrabold">${Number(v).toLocaleString('en-US')}</div></div>`).join('');
}

async function users(page = 0, q = '') {
  $('#view').className = 'grid gap-3';
  const rows = await api('/api/admin/users', 'POST', { q, page });
  $('#view').innerHTML = `<div class="card flex gap-2"><input id="uq" class="flex-1" placeholder="Search by ID or name" value="${esc(q)}"><button class="btn" id="usb">Search</button></div>` +
    rows.map(u => `<div class="card flex flex-wrap items-center gap-2" data-id="${u.id}">
      <div class="flex-1 min-w-[180px]"><b>${esc(u.name)}</b> ${u.banned ? '<span class="text-red-400 text-xs">BANNED</span>' : ''}<br>
        <span class="muted text-xs">ID ${u.id} · lvl ${u.tap_lvl} · ${u.ref_count} friends · last seen ${u.last_seen ? new Date(u.last_seen * 1000).toLocaleString() : '—'}</span></div>
      <b class="tabular-nums">${Math.floor(u.coins).toLocaleString('en-US')}</b>
      <button class="btn alt" data-a="add">+/− points</button><button class="btn alt" data-a="set">Set</button>
      <button class="btn alt" data-a="msg">Message</button><button class="btn alt" data-a="reset">Reset</button>
      <button class="btn ${u.banned ? '' : 'red'}" data-a="${u.banned ? 'unban' : 'ban'}">${u.banned ? 'Unban' : 'Ban'}</button></div>`).join('') +
    `<div class="flex gap-2 justify-center"><button class="btn alt" id="pp" ${page ? '' : 'disabled'}>Prev</button><button class="btn alt" id="pn" ${rows.length < 20 ? 'disabled' : ''}>Next</button></div>`;
  $('#usb').onclick = () => users(0, $('#uq').value); $('#pp').onclick = () => users(page - 1, q); $('#pn').onclick = () => users(page + 1, q);
  document.querySelectorAll('[data-a]').forEach(b => b.onclick = async () => {
    const id = b.closest('[data-id]').dataset.id, a = b.dataset.a; let value;
    if (['add', 'set', 'msg'].includes(a)) { value = await promptX(a === 'msg' ? 'Message to send (HTML allowed)' : 'Amount'); if (value === null) return; }
    else if (!(await confirmX(`${a} user ${id}?`))) return;
    await api('/api/admin/user', 'POST', { id, action: a, value }); users(page, q);
  });
}

async function crud(path, fields, pk) {
  $('#view').className = 'grid gap-3';
  const rows = await api(path), blank = Object.fromEntries(fields.map(f => [f.k, f.def ?? '']));
  $('#view').innerHTML = '';
  [blank, ...rows].forEach((r, i) => {
    const d = document.createElement('div'); d.className = 'card flex flex-wrap gap-2 items-end';
    d.innerHTML = (i ? '' : '<div class="w-full font-bold">Add new</div>') + fields.map(f => {
      const v = r[f.k] ?? '', dis = (f.k === pk && i) || (f.auto) ? 'disabled' : '';
      const inp = f.opts ? `<select data-k="${f.k}">${f.opts.map(o => `<option ${o == v ? 'selected' : ''}>${o}</option>`).join('')}</select>`
        : f.type === 'bool' ? `<input type="checkbox" data-k="${f.k}" ${v ? 'checked' : ''}>`
        : `<input data-k="${f.k}" type="${f.type || 'text'}" value="${esc(v)}" ${dis} ${f.auto && !i ? 'placeholder="auto"' : ''}>`;
      return `<label class="text-xs muted">${f.label}<br>${inp}</label>`;
    }).join('') + `<button class="btn save">${i ? 'Save' : 'Add'}</button>` + (i ? '<button class="btn red del">Delete</button>' : '');
    d.querySelector('.save').onclick = async () => {
      const o = {}; d.querySelectorAll('[data-k]').forEach(e => o[e.dataset.k] = e.type === 'checkbox' ? +e.checked : e.type === 'number' ? Number(e.value) : e.value);
      await api(path, 'POST', o); crud(path, fields, pk);
    };
    if (i) d.querySelector('.del').onclick = async () => { if (await confirmX('Delete?')) { await api(path, 'DELETE', { [pk]: r[pk] }); crud(path, fields, pk); } };
    $('#view').append(d);
  });
}

async function settings() {
  const s = await api('/api/admin/settings'), hint = {
    ref_bonus: 'Points each side gets per invited friend', ref_premium_bonus: 'Same, when the invited friend has Telegram Premium',
    base_energy: 'Starting max energy', offline_cap_hours: 'Max hours of offline income', daily_base: 'Daily reward base (× streak day, max ×10)',
    frenzy_sec: 'Frenzy duration (seconds)', frenzy_mult: 'Frenzy tap multiplier', max_boosts: 'Daily uses of each boost',
    tap_rate: 'Max taps per second accepted by the server (anti-cheat)', maintenance: '1 = lock the app for everyone except admins', welcome_text: 'Bot /start message. {name} = user name' };
  $('#view').innerHTML = `<div class="card grid gap-3">${Object.entries(s).map(([k, v]) =>
    `<label class="block"><span class="font-semibold">${k}</span> <span class="muted text-xs">${hint[k] || ''}</span><br>
     <input data-k="${k}" class="w-full" value="${esc(v)}"></label>`).join('')}<button class="btn" id="ss">Save settings</button></div>`;
  $('#ss').onclick = async () => { const o = {}; document.querySelectorAll('[data-k]').forEach(e => o[e.dataset.k] = e.value); await api('/api/admin/settings', 'POST', o); alertX('Saved'); };
}

async function broadcast() {
  $('#view').innerHTML = `<div class="card grid gap-3"><h2 class="font-bold">Message every player</h2>
    <textarea id="bt" rows="5" placeholder="Text (HTML allowed: &lt;b&gt;, &lt;i&gt;, &lt;a href&gt;)"></textarea>
    <div><button class="btn" id="bs">Send broadcast</button> <span id="bst" class="muted ml-2"></span></div></div>
    <div class="card flex flex-wrap items-end gap-2"><label class="text-xs muted">Gift points to all players<br><input id="ga" type="number" value="1000"></label><button class="btn" id="gb">Gift everyone</button></div>`;
  const poll = async () => { const s = await api('/api/admin/broadcast'); $('#bst').textContent = s.total ? `${s.running ? 'Sending… ' : 'Done: '}${s.sent}/${s.total} sent, ${s.failed} failed` : ''; };
  poll(); show.poll = setInterval(poll, 1500);
  $('#bs').onclick = async () => { if (!$('#bt').value.trim() || !(await confirmX('Send to ALL players?'))) return; await api('/api/admin/broadcast', 'POST', { text: $('#bt').value }); poll(); };
  $('#gb').onclick = async () => { if (await confirmX('Give ' + $('#ga').value + ' points to every player?')) { await api('/api/admin/gift', 'POST', { amount: $('#ga').value }); alertX('Done'); } };
}
show('dashboard');
</script>
</body>
</html>
